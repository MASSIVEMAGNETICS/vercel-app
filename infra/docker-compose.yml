version: '3.9'

services:
  api:
    image: node:20
    working_dir: /workspace
    volumes:
      - ..:/workspace
    ports:
      - "${API_PORT:-4000}:4000"
    command: sh -c "npm install && npm run dev:api"
    env_file:
      - ../.env

  web:
    image: node:20
    working_dir: /workspace
    volumes:
      - ..:/workspace
    ports:
      - "${WEB_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev:web"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
    env_file:
      - ../.env
    depends_on:
      - api
